<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- rsvg-convert renders of the figure SVGs: Arial (not installed on klone) -> Arimo (metric-compatible), so PDF/PNG
     text widths match the layout matplotlib computed and what Illustrator shows with Arial. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/gscratch/stergachislab/bmallo/large_home/projects/HPRC_driver_variants/scripts/fonts</dir>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
</fontconfig>
